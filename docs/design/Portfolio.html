<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio — Lucas Almeida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap">
<style>
html,body{margin:0;padding:0;background:#0a0a0f}
body{font-family:'JetBrains Mono',monospace}
*{box-sizing:border-box}
a{color:#b44dff}a:hover{color:#00f0ff}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cursor{animation:blink 1s steps(2) infinite}
.project-card:hover{box-shadow:var(--hs)!important;transform:translateY(-3px)}
@keyframes pulse-neon{0%,100%{box-shadow:0 0 18px var(--acc),0 0 36px transparent}50%{box-shadow:0 0 28px var(--acc),0 0 56px var(--acc)}}
.hero-card:hover{transform:rotate(0deg) translateY(-10px) scale(1.04)!important}
@keyframes term-flash{0%{opacity:0;filter:blur(2px)}100%{opacity:1;filter:none}}
.term-flash{animation:term-flash .35s ease-out}
.neon-btn:hover{animation:pulse-neon 1.2s ease-in-out infinite;transform:translateY(-1px)}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="site-core.jsx"></script>
<script type="text/babel" src="site-home.jsx"></script>
<script type="text/babel" src="site-project.jsx"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#080010"><svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect x="440" y="240" width="320" height="320" rx="24" fill="none" stroke="#b44dff" stroke-width="16"></rect><text x="600" y="455" text-anchor="middle" font-family="monospace" font-weight="700" font-size="150" fill="#b44dff">LA</text></svg></template>
<div id="root"></div>
<script type="text/babel">
const H = { hd: 5140, hm: 8000, pd: 2300, pm: 2900 };
function App() {
  return (
    <DesignCanvas>
      <DCSection id="home-desktop" title="Home · Desktop 1440">
        <DCArtboard id="home-d-dark" label="Tema Escuro (padrão)" width={1440} height={H.hd}><Site theme="dark" layout="desktop"></Site></DCArtboard>
        <DCArtboard id="home-d-light" label="Tema Claro" width={1440} height={H.hd}><Site theme="light" layout="desktop"></Site></DCArtboard>
      </DCSection>
      <DCSection id="home-mobile" title="Home · Mobile 390">
        <DCArtboard id="home-m-dark" label="Tema Escuro" width={390} height={H.hm}><Site theme="dark" layout="mobile"></Site></DCArtboard>
        <DCArtboard id="home-m-light" label="Tema Claro" width={390} height={H.hm}><Site theme="light" layout="mobile"></Site></DCArtboard>
      </DCSection>
      <DCSection id="case-desktop" title="Página de projeto · Desktop 1440">
        <DCArtboard id="case-d-dark" label="Tema Escuro" width={1440} height={H.pd}><Site theme="dark" layout="desktop" initialView={0}></Site></DCArtboard>
        <DCArtboard id="case-d-light" label="Tema Claro" width={1440} height={H.pd}><Site theme="light" layout="desktop" initialView={0}></Site></DCArtboard>
      </DCSection>
      <DCSection id="case-mobile" title="Página de projeto · Mobile 390">
        <DCArtboard id="case-m-dark" label="Tema Escuro" width={390} height={H.pm}><Site theme="dark" layout="mobile" initialView={0}></Site></DCArtboard>
        <DCArtboard id="case-m-light" label="Tema Claro" width={390} height={H.pm}><Site theme="light" layout="mobile" initialView={0}></Site></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App></App>);
</script>
</body>
</html>
